<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>{Title}</title>
    <link href='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.Core.css")}'
        rel="stylesheet" type="text/css" />
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.Languages.en.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.Core.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.BetType.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.GridHeader.js")}'
        type="text/javascript"></script>
    <script src='{static:HttpContext.Current.GetWebResourceUrl("Fanex.PTVirtualSports.UI.BettingLimit.js")}'
        type="text/javascript"></script>
    <script src='{static:Fanex.PTEngine.HttpContextExtension._WebUtils.GetWebResourceUrl("Fanex.PTEngine.UI.knockout-2.0.0.js")}'
        type="text/javascript"></script>
    <script src='{dataSource}?targetCustId={targetCustId}&targetRoleId={targetRoleId}&formType={formType}'
        type="text/javascript"></script>
    <!--CssBlock-->
    <!--/CssBlock-->
</head>
<body>
    <div id="header_main" class="pt7">
        {Title}
    </div>
    <div class="minWidthCustomer">
        {static:new Fanex.Age.UI.Components.ErrorMsg.ErrorMsg_Template()}
        <div class="customerInfo">
            {static:new Fanex.PTVirtualSports.Templates.InformationSection_Template()}
        </div>
        <div class="clearBlock">
        </div>
        <div class="headerBetSetting">
            <div id="saveBetSetting" class="saveDiv">
                <input id='btnSaveBetSetting' type="button" accountpermisssion="[B]" class="save"
                    title="{static:Resources.Lang.saveBetSetting}" data-bind="click: saveBettingLimit" />
            </div>
            <div>
                {static:Resources.Lang.lblBetSetting}
            </div>
        </div>
        <div id="bettingLimitContainer">
        </div>
        <div class="clearBlock">
        </div>
        <div class="headerPositionTaking">
            <div id="savePositionTaking" class="saveDiv">
                <input id='btnSavePositionTaking' type="button" accountpermisssion="[B]" class="save"
                    title="{static:Resources.Lang.savePositionTaking}" data-bind="click: savePositionTaking" />
            </div>
            <div>
                {static:Resources.Lang.positiontaking}
            </div>
        </div>
        <div id="positionTaking">
        </div>
        <div class="clearBlock">
        </div>
        <div class="btnRight">
            <button data-bind='click: saveCustomer' accountpermisssion="[B]" class="btnMain"
                id='btnSubmit'>
                {actionName}
            </button>
        </div>
    </div>
    <!--ScriptBlock-->
    <!--/ScriptBlock-->
</body>
</html>
